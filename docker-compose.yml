services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  web:
    build:
      context: .
    command: >
      bash -c "
        python3 tabbycat/manage.py migrate &&
        gunicorn tabbycat.wsgi:application --bind 0.0.0.0:8000
      "
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  pgdata: